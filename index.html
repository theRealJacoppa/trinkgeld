<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1214">
<title>Trinkgeld</title>
<meta name="description" content="Trinkgeld einer Schicht aufteilen und zu mehreren Zeitpunkten auszahlen">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trinkgeld">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1214; --tape:#141D1F; --tape2:#182325; --rule:#26383D;
  --text:#E6EDEC; --muted:#86A0A2; --petrol:#2E9E96; --signal:#F0A24A; --warn:#E2705F; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding:0 16px calc(48px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 18px}
.mark{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1}
.mark span{color:var(--petrol)}
.date{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:5px}
.hbtn{
  background:none;border:1px solid var(--rule);color:var(--muted);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 11px;border-radius:99px;cursor:pointer;touch-action:manipulation;
}
.hbtn:hover{color:var(--text);border-color:var(--muted)}

.status{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--tape)}
.status div{padding:11px 12px 12px}
.status div + div{border-left:1px solid var(--rule)}
.status .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.status .n{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;letter-spacing:-.02em;margin-top:3px}

.addrow{display:flex;align-items:center;gap:10px;margin:9px 2px 18px}
.addrow .who{flex:1;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.35}
.addrow button{
  flex:none;background:none;border:1px dashed var(--rule);color:var(--petrol);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.03em;
  padding:8px 12px;border-radius:99px;cursor:pointer;touch-action:manipulation;white-space:nowrap;
}
.addrow button:hover{border-color:var(--petrol);border-style:solid}

.card{background:var(--tape);border:1px solid var(--rule);border-radius:var(--r);padding:18px 16px;margin-bottom:16px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--petrol);margin-bottom:14px}
h2{font-family:"Space Grotesk",sans-serif;font-size:17px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 16px}

.field{margin-bottom:13px}
.field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp{position:relative}
.inp input{
  width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:10px;color:var(--text);
  font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:500;padding:12px 44px 12px 14px;letter-spacing:-.02em;
}
.inp input:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px rgba(46,158,150,.16)}
.inp input.bad{border-color:var(--warn);box-shadow:0 0 0 3px rgba(226,112,95,.14)}
.inp .cur{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:17px;pointer-events:none}
.sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:5px;padding-left:2px;min-height:16px}
.sub.bad{color:var(--warn)}

.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{
  flex:0 0 52px;background:var(--ink);border:1px solid var(--rule);border-radius:10px;color:var(--text);
  font-size:24px;font-family:"IBM Plex Mono",monospace;cursor:pointer;line-height:1;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.stepper button:hover{border-color:var(--petrol)}
.stepper button:active{background:var(--tape2);border-color:var(--petrol)}
.stepper .val{
  flex:1;display:flex;align-items:center;justify-content:center;background:var(--ink);
  border:1px solid var(--rule);border-radius:10px;font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:500;
}
.stepper .val small{color:var(--muted);font-size:12px;margin-left:8px;letter-spacing:.06em}

.grouprow{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.grouprow .gname{flex:1;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);line-height:1.3}
.grouprow .gname b{display:block;color:var(--text);font-weight:500;font-size:12.5px}
.grouprow .stepper{flex:0 0 152px}
.grouprow .stepper button{flex:0 0 42px;font-size:20px}
.grouprow .stepper .val{font-size:18px}

.go{
  width:100%;margin-top:6px;padding:15px;border:none;border-radius:11px;background:var(--signal);color:#241503;
  cursor:pointer;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;touch-action:manipulation;
}
.go:disabled{background:var(--rule);color:var(--muted);cursor:not-allowed}
.go.ghost{background:none;border:1px solid var(--rule);color:var(--muted);font-size:13px;padding:11px}
.go.ghost:hover{color:var(--text);border-color:var(--muted)}

.perf{height:1px;margin:15px -16px;background:repeating-linear-gradient(90deg,var(--rule) 0 5px,transparent 5px 10px)}
.beleg{font-family:"IBM Plex Mono",monospace;font-size:13.5px}
.r{display:flex;align-items:baseline;gap:7px;padding:3.5px 0}
.r .l{color:var(--muted);white-space:nowrap;font-size:12.5px}
.r .dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-4px);min-width:10px}
.r .v{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.r.sum{border-top:1px solid var(--rule);margin-top:5px;padding-top:7px}
.r.sum .l{color:var(--text)}
.r.note .l{font-size:12px}
.r .v.dim{color:var(--muted);font-weight:400}
.r .v.round{color:var(--signal)}

.grp{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-top:10px;background:var(--tape2)}
.grp .gh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--petrol);margin-bottom:6px}

.payout{border-top:2px solid var(--rule);margin-top:11px;padding-top:13px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.payout .lbl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.04em;line-height:1.4}
.payout .amt{font-family:"IBM Plex Mono",monospace;font-size:29px;font-weight:600;color:var(--signal);letter-spacing:-.03em}
.payout .amt.zero{color:var(--muted)}

.flag{display:flex;gap:8px;margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(226,112,95,.09);border:1px solid rgba(226,112,95,.32);color:#F0B0A5;font-size:12.8px;line-height:1.4}
.flag.ok{background:rgba(46,158,150,.09);border-color:rgba(46,158,150,.3);color:#9AD8D2}

/* Restbetrag am Schichtende */
.los{margin-top:16px;border-top:1px solid var(--rule);padding-top:16px}

.hist{margin-top:26px}
.histhead{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-left:2px}
details.item{background:var(--tape);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
details.item summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:baseline;gap:10px}
details.item summary::-webkit-details-marker{display:none}
summary .no{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--petrol);letter-spacing:.08em}
summary .who{font-size:13.5px;color:var(--muted);flex:1}
summary .amt{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
details.item .body{padding:0 15px 15px;border-top:1px solid var(--rule);margin-top:2px;padding-top:13px}
details.item[open] summary{padding-bottom:9px}
.joinitem{background:none;border:1px dashed var(--rule);border-radius:var(--r);margin-bottom:9px;padding:11px 15px;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);display:flex;gap:10px}
.joinitem .no{color:var(--petrol);font-size:11px;letter-spacing:.08em;flex:none}

.foot{margin-top:22px}
.foot .go{margin-top:0}

@media (prefers-reduced-motion:no-preference){
  .card,details.item{animation:in .22s ease both}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="mark">Trinkgeld<span>.</span></div>
    <div class="date" id="date">—</div>
  </div>
  <button class="hbtn" id="reset" hidden>Neue Schicht</button>
</header>
<div id="app"></div>
</div>

<script>
/* ══════════ Speicher ══════════ */
const KEY = "trinkgeld_v3";
const Store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return null;
  },
  async save(d){
    const s = JSON.stringify(d);
    try{ if(window.storage) await window.storage.set(KEY, s); }catch(e){}
    try{ localStorage.setItem(KEY, s); }catch(e){}
  },
  async clear(){
    try{ if(window.storage) await window.storage.delete(KEY); }catch(e){}
    try{ localStorage.removeItem(KEY); }catch(e){}
  }
};

/* ══════════ Helfer ══════════ */
const nf  = new Intl.NumberFormat("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const f   = v => nf.format(isFinite(v) ? v : 0);
const eur = v => f(v) + " €";
/* Immer abrunden: es kann nie mehr rausgehen, als reingekommen ist. */
const floor50 = v => Math.floor(v * 2 + 1e-9) / 2;
const num = s => { if(typeof s==="number") return s; const t=String(s).trim().replace(/\s/g,"").replace(",","."); if(t==="") return NaN; const v=parseFloat(t); return isFinite(v)?v:NaN; };
const hhmm = d => d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const now  = () => hhmm(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum = a => a.reduce((x,y)=>x+y,0);

/* ── Halten zum Weiterzählen ── */
/* Genau ein Timer, ein globaler Stopp. Nichts läuft weiter, was das Loslassen nicht kennt. */
let activeStop = null;
function stopHold(){ if(activeStop){ activeStop(); activeStop = null; } }
["pointerup","pointercancel","pointerleave","blur","contextmenu"].forEach(ev => window.addEventListener(ev, stopHold, true));
document.addEventListener("visibilitychange", () => { if(document.hidden) stopHold(); });

function holdable(btn, fn){
  let delay = null, rep = null, viaPointer = false;
  const stop = () => { clearTimeout(delay); clearInterval(rep); delay = null; rep = null; };
  btn.addEventListener("pointerdown", e => {
    if(e.button && e.button !== 0) return;
    e.preventDefault();
    viaPointer = true;
    stopHold();
    activeStop = stop;
    fn();
    delay = setTimeout(() => { rep = setInterval(fn, 170); }, 450);
  });
  btn.addEventListener("pointerup", stopHold);
  btn.addEventListener("pointercancel", stopHold);
  btn.addEventListener("contextmenu", e => e.preventDefault());
  btn.addEventListener("click", () => { if(!viaPointer) fn(); viaPointer = false; });
}

/* ══════════ Rechenkern ══════════ */
const total = gs => sum(gs.map(g => g.n));

function mergeGroups(gs){
  const out = [];
  for(const x of gs){
    const m = out.find(y => Math.abs(y.g - x.g) < 0.005);
    if(m) m.n += x.n; else out.push({...x});
  }
  return out;
}
function fresh(){ return {groups:[{label:"Schichtstart", n:S.start, g:0}], entnommen:0, gesamtVorher:0, lastKarte:0}; }

function applyJoin(st, count, t){
  const groups = mergeGroups([...st.groups.map(x=>({...x})), {label:"dazu "+t, n:count, g:0}]);
  return {st:{...st, groups}, row:{type:"join", t, count, nNach:total(groups)}};
}

function applyPay(st, bar, karte, leave, t){
  const nVor      = total(st.groups);
  const gesamt    = bar + st.entnommen + karte;
  const abschnitt = gesamt - st.gesamtVorher;
  const anteil    = nVor > 0 ? abschnitt / nVor : 0;

  const parts = st.groups.map((x,i) => {
    const vorher = x.g, roh = x.g + anteil, proKopf = Math.max(0, floor50(roh));
    const k = Math.max(0, Math.min(leave[i]||0, x.n));
    return {label:x.label, nGroup:x.n, vorher, anteil, roh, proKopf, k, summe:proKopf*k};
  });
  const summe   = sum(parts.map(p => p.summe));
  const geht    = sum(parts.map(p => p.k));
  const entnNeu = st.entnommen + summe;

  let groups = st.groups
      .map((x,i) => ({...x, g:x.g + anteil, n:x.n - parts[i].k}))
      .filter(x => x.n > 0);
  const nNach = total(groups);
  if(nNach > 0){
    const per = ((gesamt - entnNeu) - sum(groups.map(x => x.n * x.g))) / nNach;
    groups.forEach(x => x.g += per);
    groups = mergeGroups(groups);
  }

  const row = {type:"pay", t, bar, karte, gesamt, gesamtVorher:st.gesamtVorher, abschnitt, anteil,
               nVor, nNach, parts, summe, geht, entnVor:st.entnommen,
               kasseNach:bar - summe, rest:gesamt - entnNeu};
  return {st:{groups, entnommen:entnNeu, gesamtVorher:gesamt, lastKarte:karte}, row};
}

function derive(){
  let st = fresh(); const rows = [];
  for(const ev of S.events){
    const res = ev.type === "join" ? applyJoin(st, ev.count, ev.t)
                                   : applyPay(st, ev.bar, ev.karte, ev.leave || [], ev.t);
    st = res.st; rows.push(res.row);
  }
  return {rows, ...st, n: total(st.groups)};
}

/* ══════════ Zustand ══════════ */
let S = null;
let draft = {bar:"", karte:"", leave:[], touched:false};

function syncLeave(st){
  const L = st.groups.map((g,i) => Math.max(0, Math.min(draft.leave[i] || 0, g.n)));
  if(st.groups.length === 1 && L[0] === 0 && !draft.touched) L[0] = 1;
  draft.leave = L;
  return L;
}

function preview(st){
  const bar = num(draft.bar), karte = num(draft.karte);
  const cardOk = !(isFinite(karte) && karte < st.lastKarte - 0.005);
  if(!isFinite(bar) || !isFinite(karte) || !cardOk) return {ok:false, cardOk};
  return {ok:true, cardOk, row: applyPay(st, bar, karte, draft.leave, now()).row};
}

/* ══════════ Beleg ══════════ */
function row(label, value, cls){
  return `<div class="r ${cls&&cls.row||""}"><span class="l">${label}</span><span class="dots"></span><span class="v ${cls&&cls.v||""}">${value}</span></div>`;
}
function belegHTML(c, nr){
  const multi = c.parts.length > 1;
  let mitte;
  if(multi){
    mitte = c.parts.map(p => `
      <div class="grp">
        <div class="gh">${esc(p.label)} · ${p.nGroup} ${p.nGroup===1?"Person":"Personen"}</div>
        ${row("Guthaben vorher", eur(p.vorher), {v:"dim"})}
        ${row("+ Anteil Abschnitt " + nr, eur(p.anteil), {v:"dim"})}
        ${row("Guthaben je Person", eur(p.roh), {row:"sum"})}
        ${row("abgerundet auf 0,50 €", eur(p.proKopf), {v:"round"})}
        ${p.k > 0 ? row(p.k + " × auszahlen", eur(p.summe)) : row("niemand geht", "—", {v:"dim"})}
      </div>`).join("");
  }else{
    const p = c.parts[0] || {vorher:0, roh:0, proKopf:0};
    mitte = row("+ Guthaben aus vorher", eur(p.vorher), {v:"dim"})
          + row("Guthaben je Person", eur(p.roh), {row:"sum"})
          + row("abgerundet auf 0,50 €", eur(p.proKopf), {v:"round"});
  }
  const rest = c.parts.filter(p => p.k > 0).map(p => p.roh - p.proKopf);
  const restJe = rest.length ? Math.max(...rest) : 0;
  const label = c.geht === 0 ? "Zwischenstand · niemand geht"
              : c.parts.filter(p=>p.k>0).map(p => `${p.k} × ${eur(p.proKopf)}`).join("<br>");

  return `
  <div class="beleg">
    ${row("Bar in der Kasse", eur(c.bar))}
    ${row("+ schon ausgezahlt", eur(c.entnVor), {v:"dim"})}
    ${row("+ Karte laut Chef", eur(c.karte))}
    ${row("Gesamt bis jetzt", eur(c.gesamt), {row:"sum"})}
    ${row("− Stand bei Abschnitt " + String(nr-1).padStart(2,"0"), eur(c.gesamtVorher), {v:"dim"})}
    ${row("Neu in Abschnitt " + String(nr).padStart(2,"0"), eur(c.abschnitt), {row:"sum"})}
    ${row("÷ " + c.nVor + " Anwesende", eur(c.anteil))}
    ${mitte}
    <div class="payout">
      <span class="lbl">${label}</span>
      <span class="amt ${c.summe===0?"zero":""}">${eur(c.summe)}</span>
    </div>
    <div style="margin-top:11px">
      ${c.nNach > 0
        ? row("Danach " + c.nNach + " Anwesende, offen", eur(c.rest), {row:"note", v:"dim"})
        : row("Rest im Topf", eur(c.rest), {row:"note", v:"dim"})}
      ${row("Kasse danach (bar)", eur(c.kasseNach), {row:"note", v:"dim"})}
    </div>
    ${c.abschnitt < -0.005 ? `<div class="flag">Der Gesamtstand liegt unter dem letzten Abschnitt. Prüf die Barzahl.</div>` : ""}
    ${c.kasseNach < -0.005 ? `<div class="flag">In der Kasse liegen nur ${eur(c.bar)}. Für ${eur(c.summe)} fehlen ${eur(-c.kasseNach)} — das muss der Chef vom Kartenanteil dazugeben.</div>` : ""}
    ${restJe > 0.005 ? `<div class="flag ok">Abgerundet: bis zu ${eur(restJe)} je Person bleiben im Topf${c.nNach>0?" und gehen an die Verbleibenden":" und bleiben als Rest übrig"}.</div>` : ""}
  </div>`;
}

/* ══════════ Bildschirm ══════════ */
const app = document.getElementById("app");
const resetBtn = document.getElementById("reset");
const dateEl = document.getElementById("date");
let refs = {};

function mount(){
  stopHold(); refs = {};
  if(!S){ mountSetup(); return; }

  resetBtn.hidden = false;
  const d0 = new Date(S.datum);
  dateEl.textContent = d0.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}) + " · Start " + S.start;

  const st = derive();
  const fertig = st.n <= 0;
  syncLeave(st);
  const nr = S.events.filter(e => e.type === "pay").length + 1;
  const gruppenText = st.groups.map(g => `${g.n} ${esc(g.label)}`).join(" · ");

  app.innerHTML = `
    <div class="status">
      <div><div class="k">Anwesend</div><div class="n">${st.n}</div></div>
      <div><div class="k">Gesammelt</div><div class="n">${f(st.gesamtVorher)}</div></div>
      <div><div class="k">Ausgezahlt</div><div class="n">${f(st.entnommen)}</div></div>
    </div>
    <div class="addrow">
      <span class="who">${fertig ? "Schicht abgerechnet" : gruppenText}</span>
      ${fertig ? "" : `<button id="join">+ Person kommt dazu</button>`}
    </div>

    ${fertig ? `<div class="card" id="endCard"></div>` : `
      <div class="card">
        <div class="eyebrow">Abschnitt ${String(nr).padStart(2,"0")}</div>
        <h2>Jetzt auszahlen</h2>
        <p class="hint">Kasse zählen, Kartenstand vom Chef eintragen.</p>

        <div class="field">
          <label for="bar">Bar in der Kasse</label>
          <div class="inp"><input id="bar" inputmode="decimal" autocomplete="off" placeholder="0,00"><span class="cur">€</span></div>
          <div class="sub" id="barSub"></div>
        </div>
        <div class="field">
          <label for="karte">Karte gesamt laut Chef</label>
          <div class="inp"><input id="karte" inputmode="decimal" autocomplete="off" placeholder="${st.lastKarte>0?f(st.lastKarte):"0,00"}"><span class="cur">€</span></div>
          <div class="sub" id="karteSub"></div>
        </div>
        <div class="field">
          <label>Wer geht</label>
          <div id="leaveArea"></div>
        </div>

        <div class="perf"></div>
        <div id="preview"></div>
        <button class="go" id="pay" disabled style="margin-top:16px">Auszahlen</button>
      </div>`}

    <div class="hist">
      <div class="histhead">Verlauf</div>
      <div id="histList"></div>
      ${S.events.length ? `<div class="foot"><button class="go ghost" id="undo">Letzten Eintrag löschen</button></div>` : ""}
    </div>
  `;

  /* ── Verlauf, beginnend bei Abschnitt 00 ── */
  let payNr = 0;
  document.getElementById("histList").innerHTML =
    `<div class="joinitem"><span class="no">00</span><span>${hhmm(d0)} · Schichtstart · ${S.start} ${S.start===1?"Person":"Personen"}</span></div>`
    + st.rows.map(c => {
        if(c.type === "join"){
          return `<div class="joinitem"><span class="no">+</span><span>${c.t} · ${c.count} ${c.count===1?"Person kommt":"Personen kommen"} dazu — jetzt ${c.nNach} anwesend</span></div>`;
        }
        payNr++;
        const t = c.geht === 0 ? "Zwischenstand, niemand geht" : `${c.geht} ${c.geht===1?"Person":"Personen"} ausgezahlt`;
        return `<details class="item">
          <summary><span class="no">${String(payNr).padStart(2,"0")}</span><span class="who">${c.t} · ${t}</span><span class="amt">${eur(c.summe)}</span></summary>
          <div class="body">${belegHTML(c, payNr)}</div>
        </details>`;
      }).join("");

  const undo = document.getElementById("undo");
  if(undo) undo.onclick = async () => {
    if(!confirm("Letzten Eintrag löschen?")) return;
    S.events.pop();
    draft = {bar:"", karte:"", leave:[], touched:false};
    await Store.save(S); mount();
  };

  const join = document.getElementById("join");
  if(join) join.onclick = async () => {
    S.events.push({type:"join", t:now(), count:1});
    draft.leave = []; draft.touched = false;
    await Store.save(S); mount();
  };

  if(fertig){ renderEnd(st); return; }

  /* ── Eingabefelder: einmal gebaut, danach unangetastet ── */
  refs.st = st; refs.nr = nr;
  refs.bar = document.getElementById("bar");
  refs.karte = document.getElementById("karte");
  refs.barSub = document.getElementById("barSub");
  refs.karteSub = document.getElementById("karteSub");
  refs.preview = document.getElementById("preview");
  refs.pay = document.getElementById("pay");
  refs.bar.value = draft.bar;
  refs.karte.value = draft.karte;
  refs.bar.addEventListener("input", () => { draft.bar = refs.bar.value; update(); });
  refs.karte.addEventListener("input", () => { draft.karte = refs.karte.value; update(); });

  const area = document.getElementById("leaveArea");
  refs.leaveVals = [];
  if(st.groups.length === 1){
    area.innerHTML = `<div class="stepper">
      <button type="button" data-i="0" data-d="-1" aria-label="weniger">−</button>
      <div class="val"><span id="lv0">${draft.leave[0]}</span><small>von ${st.groups[0].n}</small></div>
      <button type="button" data-i="0" data-d="1" aria-label="mehr">+</button></div>`;
  }else{
    area.innerHTML = st.groups.map((g,i) => `
      <div class="grouprow">
        <div class="gname"><b>${esc(g.label)}</b>${g.n} ${g.n===1?"Person":"Personen"}</div>
        <div class="stepper">
          <button type="button" data-i="${i}" data-d="-1" aria-label="weniger">−</button>
          <div class="val"><span id="lv${i}">${draft.leave[i]}</span></div>
          <button type="button" data-i="${i}" data-d="1" aria-label="mehr">+</button>
        </div>
      </div>`).join("");
  }
  st.groups.forEach((g,i) => refs.leaveVals[i] = document.getElementById("lv"+i));
  area.querySelectorAll("[data-d]").forEach(b => holdable(b, () => {
    const i = +b.dataset.i, d = +b.dataset.d;
    const v = Math.max(0, Math.min(draft.leave[i] + d, refs.st.groups[i].n));
    if(v === draft.leave[i]) return;
    draft.leave[i] = v; draft.touched = true;
    refs.leaveVals[i].textContent = v;
    update();
  }));

  refs.pay.onclick = async () => {
    if(!preview(refs.st).ok) return;
    S.events.push({type:"pay", t:now(), bar:num(draft.bar), karte:num(draft.karte), leave:[...draft.leave]});
    draft = {bar:"", karte:"", leave:[], touched:false};
    await Store.save(S); mount(); window.scrollTo({top:0, behavior:"smooth"});
  };

  update();
}

/* Nur Anzeige — rührt die Eingabefelder nicht an. */
function update(){
  const st = refs.st;
  const karte = num(draft.karte);
  const zuKlein = isFinite(karte) && karte < st.lastKarte - 0.005;

  refs.karte.classList.toggle("bad", zuKlein);
  refs.karteSub.classList.toggle("bad", zuKlein);
  refs.karteSub.textContent = zuKlein
    ? `Kann nicht unter ${eur(st.lastKarte)} liegen — der Kartenstand wächst nur.`
    : (st.lastKarte > 0 ? `Stand aus Abschnitt ${String(refs.nr-1).padStart(2,"0")}: ${eur(st.lastKarte)}` : "Kumulierter Stand seit Schichtbeginn");

  refs.barSub.textContent = isFinite(num(draft.bar)) && st.entnommen > 0
    ? `Ohne die bereits ausgezahlten ${eur(st.entnommen)}` : "";

  const p = preview(st);
  if(p.ok){
    refs.preview.innerHTML = belegHTML(p.row, refs.nr);
    refs.pay.disabled = false;
    refs.pay.textContent = p.row.geht === 0 ? "Zwischenstand speichern"
      : p.row.parts.filter(x=>x.k>0).map(x => `${x.k} × ${eur(x.proKopf)}`).join(" + ") + " auszahlen";
  }else{
    refs.preview.innerHTML = `<p class="hint" style="margin:0;text-align:center">${
      zuKlein ? "Kartenstand korrigieren — er muss mindestens " + eur(st.lastKarte) + " sein."
              : "Beide Zahlen eintragen — der Rechenweg erscheint hier."}</p>`;
    refs.pay.disabled = true;
    refs.pay.textContent = "Auszahlen";
  }
}

/* ══════════ Schichtende ══════════ */
function renderEnd(st){
  const last = st.rows.filter(r => r.type === "pay").pop();
  const rest = last ? last.rest : 0;
  const teilnehmer = last ? last.nVor : 0;

  document.getElementById("endCard").innerHTML = `
    <div class="eyebrow">Fertig</div>
    <h2>Alle ausgezahlt</h2>
    <p class="hint" style="margin-bottom:0">${eur(st.gesamtVorher)} gesammelt, ${eur(st.entnommen)} verteilt.</p>
    ${rest > 0.005 ? `
      <div class="los">
        <div class="beleg">
          ${row("Gesamt gesammelt", eur(st.gesamtVorher), {v:"dim"})}
          ${row("− ausgezahlt", eur(st.entnommen), {v:"dim"})}
          ${row("Rest im Topf", eur(rest), {row:"sum", v:"round"})}
        </div>
        <p class="hint" style="margin:12px 0 0">Bleibt durch das Abrunden übrig — die letzten ${teilnehmer} können ihn unter sich ausmachen.</p>
      </div>` : `
      <div class="los"><p class="hint" style="margin:0">Der Topf geht genau auf, es bleibt nichts übrig.</p></div>`}
  `;
}

/* ══════════ Schichtbeginn ══════════ */
function mountSetup(){
  resetBtn.hidden = true;
  dateEl.textContent = new Date().toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">Abschnitt 00 · Schichtbeginn</div>
      <h2>Wie viele seid ihr?</h2>
      <p class="hint">Wer später dazukommt, lässt sich jederzeit nachtragen.</p>
      <div class="stepper">
        <button type="button" data-s="-1" aria-label="weniger">−</button>
        <div class="val"><span id="startVal">4</span><small>Personen</small></div>
        <button type="button" data-s="1" aria-label="mehr">+</button>
      </div>
      <button class="go" id="startBtn" style="margin-top:14px">Schicht starten</button>
    </div>`;
  let n = 4;
  const val = document.getElementById("startVal");
  app.querySelectorAll("[data-s]").forEach(b => holdable(b, () => {
    n = Math.min(60, Math.max(1, n + (+b.dataset.s)));
    val.textContent = n;
  }));
  document.getElementById("startBtn").onclick = async () => {
    S = {start:n, datum:new Date().toISOString(), events:[]};
    draft = {bar:"", karte:"", leave:[], touched:false};
    await Store.save(S); mount();
  };
}

resetBtn.onclick = async () => {
  if(!confirm("Schicht abschließen und alles zurücksetzen?")) return;
  S = null; draft = {bar:"", karte:"", leave:[], touched:false};
  await Store.clear(); mount();
};

(async () => { S = await Store.load(); mount(); })();

/* ══════════ Offline-Betrieb ══════════ */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
